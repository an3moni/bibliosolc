<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Editar contrasenya - Biblioteques Escola Solc</title>
    </head>
    <body>
        <div
            style="
                position: absolute;
                left: 5px;
                top: 5px;
                text-decoration: none;
            "
        >
            <a style="text-decoration: none; color: royalblue" href="/admin"
                >← Tornar endarrere</a
            >
        </div>
        <div id="panel">
            <h1>Canviar contrasenya d'administrador</h1>
            <hr />

            <input
                type="password"
                id="pass1"
                placeholder="Introdueix la nova contrasenya"
            />
            <input
                type="password"
                id="pass2"
                placeholder="Confirma la nova contrasenya"
            />
            <button onclick="changePass()">Canviar contrasenya</button>
        </div>
    </body>
    <style>
        #panel {
            position: absolute;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            padding: 2rem;
            border: 1px solid lightgray;
            border-radius: 0.2rem;
            transition: border-color 0.2s;
            width: 20%;
        }

        input {
            all: unset;
            border: 1px solid lightgray;
            transition: border-color 0.2s;
            border-radius: 0.2rem;
            padding: 5px;
            width: calc(100% - 1rem);
            margin-bottom: 1rem;
        }

        input:hover,
        input:focus,
        select:hover,
        select:focus {
            border-color: black;
        }

        #panel:hover,
        #panel:has(*:hover) {
            border-color: black;
        }

        button {
            all: unset;
            border: 1px solid lightgray;
            border-radius: 0.2rem;
            padding: 5px;
            transition: border-color 0.2s;
            cursor: pointer;
            width: calc(100% - 1rem);
            text-align: center;
            box-shadow: 0 10px gray;
        }
        button:hover {
            box-shadow: 0 5px gray;
            translate: 0px 5px;
        }
        button:active {
            box-shadow: 0 0 gray;
            translate: 0 10px;
        }
    </style>
    <script src="admin.js"></script>
    <script>
        requireLogin();
        async function changePass() {
            if (pass1.value != pass2.value) {
                alert("Error: both passwords must match");
                return;
            }

            const confirmed = confirm("Vols guardar aquests canvis?");

            if (!confirmed) {
                return;
            }

            const response = await fetch("/api/changepassword", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    password: getPassword(),

                    newPassword: pass1.value,
                }),
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.error ?? "Error");

                return;
            }

            alert("Contrasenya guardada!");
            sessionStorage.clear();
            window.location.reload();
        }
    </script>
</html>
