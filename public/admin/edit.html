<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Editar llibre - Biblioteques Escola Solc</title>
    </head>
    <body>
        <div
            style="
                position: absolute;
                left: 5px;
                top: 5px;
                text-decoration: none;
            "
        >
            <a style="text-decoration: none; color: royalblue" href="/admin"
                >← Tornar endarrere</a
            >
        </div>

        <div class="panel" id="edit_panel">
            <h1>Editar llibre</h1>
            <hr />

            <input id="libraryId" placeholder="Número d'identificació" />

            <br /><br />

            <input id="title" placeholder="Títol" />

            <br /><br />

            <input id="author" placeholder="Autor" />

            <br /><br />

            <select id="level"></select>

            <br /><br />

            <input id="shelfX" type="number" placeholder="Número d'armari" />

            <br /><br />

            <input
                id="shelfY"
                type="number"
                placeholder="Prestatgeria (de baix a dalt)"
            />

            <br /><br />

            <button id="create">Guardar canvis</button>

            <p id="result"></p>
        </div>

        <div class="panel" id="search_panel">
            <h1>Editar llibre</h1>

            <hr />

            <input id="query" placeholder="Busca el llibre" />
            <div id="results" style="height: 75%; overflow-y: auto"></div>
        </div>

        <div
            id="map"
            style="
                position: absolute;
                width: 400px;
                aspect-ratio: 1;
                border: 1px solid lightgray;
                border-radius: 0.2rem;
                text-align: center;
                vertical-align: middle;
                left: 62%;
                top: 50%;
                translate: 0px -50%;
            "
        >
            Aqui va un mapa de la biblioteca amb els armaris numerats
        </div>

        <style>
            #map {
                display: none;
            }
            #edit_panel {
                display: none;
            }
            .panel {
                position: absolute;
                left: 50%;
                top: 50%;
                translate: -50% -50%;
                padding: 2rem;
                border: 1px solid lightgray;
                border-radius: 0.2rem;
                transition: border-color 0.2s;
            }

            input,
            select {
                all: unset;
                border: 1px solid lightgray;
                transition: border-color 0.2s;
                border-radius: 0.2rem;
                padding: 5px;
                width: calc(100% - 1rem);
            }

            input:hover,
            input:focus,
            select:hover,
            select:focus {
                border-color: black;
            }

            .panel:hover,
            .panel:has(*:hover) {
                border-color: black;
            }

            button {
                all: unset;
                border: 1px solid lightgray;
                border-radius: 0.2rem;
                padding: 5px;
                transition: border-color 0.2s;
                cursor: pointer;
                width: calc(100% - 1rem);
                text-align: center;
                box-shadow: 0 10px gray;
            }

            *:hover > button {
                border-color: black;
            }
            button:hover {
                box-shadow: 0 5px gray;
                translate: 0px 5px;
            }
            button:active {
                box-shadow: 0 0 gray;
                translate: 0 10px;
            }

            .book {
                border: 1px solid lightgray;
                cursor: pointer;
                transition: border-color 0.2s;
                border-radius: 0.2rem;
                margin-top: 1rem;
                padding-left: 1rem;
            }
            .book:hover {
                border-color: black;
            }
        </style>

        <script src="../building.js"></script>
        <script src="/admin/admin.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

        <script>
            for (let l in building) {
                document.getElementById("level").innerHTML +=
                    "<option value='" +
                    l +
                    "'>" +
                    building[l].name +
                    "</option>";
            }

            requireLogin();

            let books = [];
            let fuse = null;

            async function loadBooks() {
                const res = await fetch("/api/listbooks");
                books = await res.json();

                fuse = new Fuse(books, {
                    keys: ["title", "author", "libraryId"],
                    //ignoreLocation: true,
                });
            }

            function renderResults(results) {
                const container = document.getElementById("results");
                container.innerHTML = "";

                for (const book of results) {
                    const div = document.createElement("div");
                    div.className = "book";

                    div.innerHTML = `
                <h3>${book.title}</h3>
                <p>${book.author}</p>
                <p>#${book.libraryId}</p>
            `;

                    div.onclick = () => {
                        editBook(book);
                    };

                    container.appendChild(div);
                }
            }

            function search(query) {
                if (!fuse || !query) {
                    renderResults(books.slice(0, 50)); // fallback
                    return;
                }

                const results = fuse
                    .search(query)
                    .slice(0, 50)
                    .map((r) => r.item);

                renderResults(results);
            }

            document.getElementById("query").addEventListener("input", (e) => {
                search(e.target.value);
            });

            loadBooks().then(() => {
                search(""); // show initial results
            });

            function editBook(book) {
                window.editingBook = book;
                //hide search and show edit+map
                document.getElementById("search_panel").style.display = "none";
                document.getElementById("edit_panel").style.display = "block";
                document.getElementById("map").style.display = "block";

                //set values
                document.getElementById("libraryId").value = book.libraryId;
                document.getElementById("title").value = book.title;
                document.getElementById("author").value = book.author;
                document.getElementById("level").value = book.level;
                document.getElementById("shelfX").value = book.shelfX;
                document.getElementById("shelfY").value = book.shelfY;
            }

            document
                .getElementById("create")
                .addEventListener("click", async () => {
                    const confirmed = confirm("Vols guardar aquests canvis?");

                    if (!confirmed) {
                        return;
                    }

                    const response = await fetch("/api/editbooks", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            password: getPassword(),

                            libraryId:
                                document.getElementById("libraryId").value,

                            title: document.getElementById("title").value,

                            author: document.getElementById("author").value,

                            level: Number(
                                document.getElementById("level").value,
                            ),

                            shelfX: Number(
                                document.getElementById("shelfX").value,
                            ),

                            shelfY: Number(
                                document.getElementById("shelfY").value,
                            ),

                            internalId: window.editingBook.id,
                        }),
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        alert(data.error ?? "Error");

                        return;
                    }

                    alert("Canvis guardats!");
                    window.location.reload();
                });
        </script>
    </body>
</html>
